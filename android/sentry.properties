defaults.url=https://sentry.io/
defaults.org=jupitrr
defaults.project=react-native
# Using SENTRY_AUTH_TOKEN environment variable
# Sentry is optional/opt-in in this OSS build (see EXPO_PUBLIC_SENTRY_DSN in .env.example) and
# no SENTRY_AUTH_TOKEN is configured in CI, so source-map upload must not be required to build.
# Set your own SENTRY_AUTH_TOKEN and flip this to true if you want upload for your own project.
auto-upload=false