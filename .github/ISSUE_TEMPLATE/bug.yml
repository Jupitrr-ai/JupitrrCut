name: Bug report
description: Something in the app is broken
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android (GitHub APK)
        - Android (Google Play)
        - Android (built from source)
        - iOS (App Store)
        - iOS (built from source)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / build number
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste any relevant logs or attach a screenshot.
    validations:
      required: false
